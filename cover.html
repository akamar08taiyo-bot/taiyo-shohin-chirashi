<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>表紙をつくる | 太陽シルバーサービス</title>
<meta name="description" content="御見積書・ご提案書などの表紙（カバー）を作成します。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef5f5; color: #12242A; font-family: 'Noto Sans JP', sans-serif; }
  .wrap { min-height: 100vh; padding: 24px 24px 120px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .inner { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 16px; }
  .back { font-size: 13px; font-weight: 700; color: #0f7f86; text-decoration: none; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .badge { background: #1e3a8a; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .14em; padding: 5px 12px; }
  h1 { margin: 8px 0 0; font-size: 30px; line-height: 1.2; font-weight: 900; }
  .lead { margin: 6px 0 0; font-size: 13px; line-height: 1.7; color: #41595E; max-width: 620px; }

  .btn { border: 1.5px solid #1e3a8a; background: #fff; color: #1e3a8a; font-family: 'Noto Sans JP', sans-serif; font-size: 12.5px; font-weight: 700; padding: 10px 18px; cursor: pointer; }
  .btn:hover { background: #1e3a8a; color: #fff; }
  .btn-primary { background: #1e3a8a; color: #fff; }
  .btn-primary:hover { background: #17306e; }

  .panel { background: #fff; border: 1.5px solid #cfe0e2; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 700; color: #41595E; }
  .field input, .field select { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; border: 1.5px solid #cfe0e2; background: #fff; padding: 10px 11px; }
  .field input:focus, .field select:focus { outline: none; border-color: #1e3a8a; }
  .hint { font-size: 11.5px; color: #5c7376; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset { border: 1.5px solid #cfe0e2; background: #fff; color: #41595E; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700; padding: 8px 14px; cursor: pointer; }
  .preset:hover { border-color: #1e3a8a; color: #1e3a8a; }
  .preset.active { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }

  .preview-label { font-size: 12px; font-weight: 700; color: #5c7376; letter-spacing: .08em; }
  .preview-scroll { overflow-x: auto; background: #dfe8e8; padding: 20px; }

  .sticky-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 12px 24px; background: #fff; border-top: 2px solid #1e3a8a; box-shadow: 0 -4px 16px rgba(15,40,42,.10); }
  .sticky-bar .info { margin-right: auto; font-size: 13px; font-weight: 700; color: #41595E; }

  /* ============ 表紙本体（A4横 297×210mm = 1123×794px @96dpi）============ */
  .cover {
    width: 1123px; height: 794px; flex: none;
    background: #fff; position: relative;
    font-family: 'Noto Serif JP', 'Yu Mincho', serif;
    color: #1a1a1a;
    box-shadow: 0 2px 14px rgba(15,40,42,.18);
    display: flex;
  }
  /* 原本は左パネルの内容が下寄せ（上半分は余白）なので justify-content: flex-end で揃える */
  .cover-back { width: 50%; padding: 46px 34px 30px 46px; display: flex; flex-direction: column; justify-content: flex-end; }
  .cover-front { width: 50%; padding: 68px 46px 34px 34px; display: flex; flex-direction: column; position: relative; }

  /* --- 右側（表面） --- */
  .corp-en { text-align: right; font-size: 13.5px; letter-spacing: .06em; color: #1a1a1a; }
  .corp-rule { height: 4px; background: #0a8a3c; margin-top: 6px; }
  .cover-title-wrap { margin-top: 165px; text-align: center; }
  .cover-title { font-size: 32px; font-weight: 600; letter-spacing: .34em; text-indent: .34em; color: #1a1a1a; line-height: 1.2; }
  .cover-title-rule { height: 3px; background: #0a8a3c; margin: 10px auto 0; width: 40%; }
  .cover-client { margin-top: 38px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: .08em; }
  .cover-client .suffix { font-size: 13px; font-weight: 400; margin-left: 10px; }
  .cover-front-foot { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .logo-mark { width: 42px; height: 42px; border-radius: 50%; background: #d81f26; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 900; letter-spacing: .02em; flex: none; }
  .foot-name { font-size: 21px; font-weight: 600; letter-spacing: .04em; }

  /* --- 左側（裏面：営業所一覧） --- */
  .hq-name { font-size: 20px; font-weight: 600; letter-spacing: .34em; text-indent: .34em; }
  .hq-line { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; padding-left: 18px; }
  .hq-label { font-size: 13px; font-weight: 600; letter-spacing: .3em; }
  .hq-detail { font-size: 12.5px; line-height: 1.55; }
  .office-cols { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  .office-item { display: flex; gap: 5px; font-size: 8.7px; line-height: 1.34; break-inside: avoid; }
  .office-box { flex: none; width: 8px; height: 8px; border: 1px solid #1a1a1a; margin-top: 2px; }
  .office-item.is-current .office-box { background: #1a1a1a; }
  .office-body { min-width: 0; }
  .office-name { font-size: 10px; font-weight: 600; letter-spacing: .16em; display: inline; }
  .office-zip { font-size: 8.7px; margin-left: 6px; }
  .office-addr { font-size: 8.7px; }
  .office-tel { font-size: 8.7px; }

  #print-holder { display: none; }
  @media print {
    body > *:not(#print-holder) { display: none !important; }
    #print-holder { display: block !important; }
    @page { size: A4 landscape; margin: 0; }
    #print-holder, #print-holder * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover { box-shadow: none; page-break-after: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div><a class="back" href="./quote.html">← 見積もりを作成する</a>　<a class="back" href="./index.html">← メインメニューへ</a></div>
    <header>
      <div>
        <div class="badge">表紙をつくる</div>
        <h1>見積書カバー</h1>
        <p class="lead">御見積書・ご提案書などの表紙です。A4横1枚で、二つ折りにすると右が表面、左が営業所一覧になります。</p>
      </div>
    </header>

    <div class="panel">
      <div class="field">
        <label>表題</label>
        <div class="presets" id="presets"></div>
      </div>
      <div class="row">
        <div class="field">
          <label for="cover-title">表題（自由入力）</label>
          <input type="text" id="cover-title" />
        </div>
        <div class="field">
          <label for="cover-client">お客様名（任意）</label>
          <input type="text" id="cover-client" placeholder="空欄なら表示しません" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="cover-suffix">お客様名の敬称</label>
          <select id="cover-suffix">
            <option value="御中">御中</option>
            <option value="様">様</option>
            <option value="">（なし）</option>
          </select>
        </div>
        <div class="field">
          <label for="cover-office">発行営業所（■印が付きます）</label>
          <select id="cover-office"></select>
        </div>
      </div>
      <div class="hint">営業所の選択は、チラシ・見積書と共通です。ここで変えると他の画面にも反映されます。</div>
    </div>

    <div class="preview-label">印刷プレビュー（実寸 A4横）</div>
    <div class="preview-scroll"><div id="preview"></div></div>
  </div>
</div>

<div class="sticky-bar">
  <div class="info" id="bar-info"></div>
  <button type="button" class="btn btn-primary" id="btn-print">🖨 印刷 / PDF保存</button>
</div>

<div id="print-holder"></div>

<script src="./assets/offices.js"></script>
<script>
(function () {
  const COVER_KEY = 'tss_cover_v1';
  const PRESETS = ['御見積書', 'ご提案書', '御請求書', '商品のご案内'];
  // 本社情報は見積書カバー（2025-02-01版）に印刷されているものを転記
  const HQ = { zip: '838-0814', address: '福岡県朝倉郡筑前町高田585番地1', tel: '0946-21-4700', fax: '0946-21-4701' };

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(COVER_KEY)) || {}; } catch (e) { return {}; }
  }
  function save(s) { try { localStorage.setItem(COVER_KEY, JSON.stringify(s)); } catch (e) {} }

  let state = Object.assign({ title: '御見積書', client: '', suffix: '御中' }, load());

  const titleInput = document.getElementById('cover-title');
  const clientInput = document.getElementById('cover-client');
  const suffixSelect = document.getElementById('cover-suffix');
  const officeSelect = document.getElementById('cover-office');

  TSS_OFFICE_MASTER.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.name; opt.textContent = o.name;
    officeSelect.appendChild(opt);
  });

  titleInput.value = state.title;
  clientInput.value = state.client;
  suffixSelect.value = state.suffix;
  officeSelect.value = tssLoadOffice().name;

  document.getElementById('presets').innerHTML = PRESETS.map(p =>
    `<button type="button" class="preset" data-t="${escapeHTML(p)}">${escapeHTML(p)}</button>`).join('');

  function officeHTML(current) {
    return TSS_OFFICE_MASTER.map(o => `
      <div class="office-item${o.name === current ? ' is-current' : ''}">
        <span class="office-box"></span>
        <span class="office-body">
          <span class="office-name">${escapeHTML(o.name)}</span><span class="office-zip">〒${escapeHTML(o.zip)}</span>
          <div class="office-addr">${escapeHTML(o.address)}</div>
          <div class="office-tel">TEL. ${escapeHTML(o.tel)}　FAX. ${escapeHTML(o.fax)}</div>
        </span>
      </div>`).join('');
  }

  function coverHTML() {
    const current = officeSelect.value;
    const client = state.client.trim();
    return `
      <div class="cover">
        <div class="cover-back">
          <div class="hq-name">太陽シルバーサービス株式会社</div>
          <div class="hq-line">
            <span class="hq-label">本社</span>
            <span class="hq-detail">〒${HQ.zip}　${HQ.address}<br>TEL. ${HQ.tel}　FAX. ${HQ.fax}</span>
          </div>
          <div class="office-cols">${officeHTML(current)}</div>
        </div>
        <div class="cover-front">
          <div>
            <div class="corp-en">TaiyoSilverService&nbsp; Corporation</div>
            <div class="corp-rule"></div>
          </div>
          <div class="cover-title-wrap">
            <div class="cover-title">${escapeHTML(state.title || '御見積書')}</div>
            <div class="cover-title-rule"></div>
            ${client ? `<div class="cover-client">${escapeHTML(client)}${state.suffix ? `<span class="suffix">${escapeHTML(state.suffix)}</span>` : ''}</div>` : ''}
          </div>
          <div class="cover-front-foot">
            <span class="logo-mark">TAIYO</span>
            <span class="foot-name">太陽シルバーサービス株式会社</span>
          </div>
        </div>
      </div>`;
  }

  function render() {
    document.getElementById('preview').innerHTML = coverHTML();
    document.querySelectorAll('.preset').forEach(b =>
      b.classList.toggle('active', b.dataset.t === state.title));
    document.getElementById('bar-info').textContent =
      '表題：' + (state.title || '—') + (state.client ? '／' + state.client + ' ' + state.suffix : '');
  }

  titleInput.addEventListener('input', () => { state.title = titleInput.value; save(state); render(); });
  clientInput.addEventListener('input', () => { state.client = clientInput.value; save(state); render(); });
  suffixSelect.addEventListener('change', () => { state.suffix = suffixSelect.value; save(state); render(); });
  officeSelect.addEventListener('change', () => { tssSaveOffice(officeSelect.value); render(); });
  document.getElementById('presets').addEventListener('click', (e) => {
    const b = e.target.closest('.preset');
    if (!b) return;
    state.title = b.dataset.t;
    titleInput.value = state.title;
    save(state); render();
  });

  document.getElementById('btn-print').addEventListener('click', () => {
    document.getElementById('print-holder').innerHTML = coverHTML();
    window.print();
  });

  render();
})();
</script>
</body>
</html>
