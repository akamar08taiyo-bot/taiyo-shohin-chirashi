<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>花王プロフェッショナル 消耗品チラシ | 太陽シルバーサービス 行橋営業所</title>
<meta name="description" content="施設・病院・事業所さま向け 花王プロフェッショナル・サービス 消耗品チラシ。手指衛生・食器洗浄・厨房・トイレ・浴室・洗濯・消臭・入浴ケアまで全商品を掲載。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./assets/design.css?v=20260905-3" />
</head>
<body>
  <div class="tss-toolbar">
    <a class="tss-back" href="./flyers.html">← チラシ一覧</a>
    <h1 id="tss-flyer-title"></h1>
    <div class="tss-toolgroup">
      <span class="tss-toolgroup-label">表示</span>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-codes" />品番・JAN</label>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-price" />価格（社内用）</label>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-ask" />お客様チェック欄</label>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-priceedit" />金額を編集</label>
    </div>
    <div class="tss-toolgroup">
      <span class="tss-toolgroup-label">編集</span>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-edit" />商品を差し替え</label>
      <label class="tss-toggle"><input type="checkbox" id="tss-toggle-quote" />見積に追加</label>
    </div>
    <a class="tss-btn" href="./quote.html" id="tss-quote-badge">見積を見る（0）</a>
    <button type="button" class="tss-btn" id="tss-print-all">すべて解除</button>
    <button type="button" class="tss-btn tss-btn-primary" id="tss-print-btn">🖨 印刷 / PDF保存</button>
  </div>
  <div class="tss-priceedit-bar" id="tss-priceedit-bar" style="display:none">
    <span class="tss-priceedit-note">金額の欄をクリックすると直接書き換えられます。単価を直すと本体価格も自動で計算し直します。</span>
    <label class="tss-toggle"><input type="checkbox" id="tss-toggle-savetable" />価格表にも保存する</label>
    <span class="tss-temp-count" id="tss-temp-count" style="display:none"></span>
    <button type="button" class="tss-btn" id="tss-temp-reset" style="display:none">変更を取り消す</button>
  </div>
  <nav class="tss-pagejump" id="tss-pagejump"></nav>
  <main class="tss-pages-scroll" id="tss-mount"></main>

  <script src="./assets/offices.js"></script>
  <script src="./assets/pricing.js"></script>
  <script src="./assets/flyer-render.js?v=20260905-3"></script>
  <script>renderFlyer('kao-pro', 'tss-mount');</script>
</body>
</html>
