  .cx-step-label { font-size: 15px; font-weight: 900; color: var(--accent); letter-spacing: .08em; }

  .cx-cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cx-cat { font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700; color: var(--text-main);
    background: #fff; border: 1.5px solid var(--border); padding: 11px 18px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .cx-n { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--text-note); }
  .cx-cat.active .cx-n { color: #cfe9ea; }
  .cx-cat:hover { border-color: var(--accent); color: var(--accent); }
  .cx-cat.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- ページ切替バー ---- */
  .cx-pagebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cx-pagetab {
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--text-sub); background: #fff; border: 1.5px solid var(--border);
    padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .cx-pagetab:hover { border-color: var(--accent); color: var(--accent); }
  .cx-pagetab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cx-pagetab .cnt { font-family: 'Roboto Mono', monospace; font-size: 12px; opacity: .8; }
  .cx-pageadd { border-color: var(--price-color); color: var(--price-color); }
  .cx-pageadd:hover { background: var(--price-color); border-color: var(--price-color); color: #fff; }
  .cx-pagedel { border: none; background: none; color: var(--text-note); font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 8px; }
  .cx-pagedel:hover { color: var(--price-color); }

  /* プレビューのページ見出し。いま編集しているページを枠で示す */
  .cx-pagewrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cx-pagenum { align-self: flex-start; font-size: 13px; font-weight: 900; color: var(--text-sub); }
  .cx-pagewrap.is-current .cx-pagenum { color: var(--accent); }
  .cx-pagewrap.is-current .page { outline: 3px solid var(--accent); outline-offset: 4px; }

  .cx-count { font-size: 15px; font-weight: 700; color: var(--text-main); }
  .cx-count strong { font-family: 'Roboto Mono', monospace; font-size: 19px; color: var(--accent); margin: 0 3px; }
  .cx-count.is-full strong { color: var(--price-color); }

  .cx-genres { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 9px 10px; background: #f4f9f9; border: 1px solid var(--border); }
  .cx-genres:empty { display: none; }
  .cx-genres-label { font-size: 12.5px; font-weight: 900; color: var(--text-sub); margin-right: 2px; }
  .cx-genre-btn { font-family: 'Noto Sans JP', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sub); background: #fff; border: 1px solid var(--border); padding: 6px 10px; cursor: pointer; }
  .cx-genre-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cx-genre-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .cx-genre-btn .cnt { font-family: 'Roboto Mono', monospace; font-size: 11px; opacity: .78; margin-left: 4px; }

  .cx-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .cx-genre-heading { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; margin-top: 5px; padding: 7px 9px; color: var(--accent); background: var(--tag-bg); border-left: 4px solid var(--accent); font-size: 13px; font-weight: 900; }
  .cx-genre-heading:first-child { margin-top: 0; }
  .cx-genre-heading .cnt { font-family: 'Roboto Mono', monospace; color: var(--text-sub); font-size: 11px; font-weight: 500; }
  .cx-item { display: flex; align-items: center; gap: 10px; border: 1px solid #e3edee; background: #fff; padding: 8px 10px; cursor: pointer; }
  .cx-item:hover { border-color: var(--accent); background: #f6fbfb; }
  .cx-item.is-checked { background: #eaf7f4; border-color: var(--accent); }
  .cx-item.is-disabled { opacity: .4; cursor: not-allowed; }
  .cx-item input { width: 17px; height: 17px; flex: none; accent-color: var(--accent); cursor: pointer; }
  .cx-item .th { width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center; }
  .cx-item .th img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cx-item .tx { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cx-item .gr { align-self: flex-start; display: inline-flex; max-width: 100%; color: #075f66; background: #e2f2f1; border-radius: 999px; padding: 2px 7px; font-size: 10.5px; font-weight: 900; line-height: 1.4; }
  .cx-item .nm { font-size: 14px; font-weight: 700; line-height: 1.35; color: var(--text-main); }
  .cx-item .mk { font-size: 12px; color: var(--text-sub); }
  .cx-empty { padding: 28px 10px; color: var(--text-sub); font-size: 15px; }

  .cx-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .cx-field { display: flex; flex-direction: column; gap: 4px; }
  .cx-field label { font-size: 13.5px; font-weight: 700; color: var(--text-main); }
  .cx-field input { font-family: 'Noto Sans JP', sans-serif; font-size: 15px; border: 1.5px solid var(--border); padding: 9px 10px; }
  .cx-field input:focus { outline: none; border-color: var(--accent); }

  /* ---- ④ 保存・共有 ---- */
  .cx-savepanel { background: #f9fcfc; border: 1.5px solid var(--border); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .cx-savehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .cx-savenote { font-size: 12px; line-height: 1.7; color: var(--text-note); }
  .cx-savetitle { font-size: 14px; font-weight: 900; color: var(--text-main); }
  .cx-savetitle .n { font-family: 'Roboto Mono', monospace; color: var(--accent); margin-left: 6px; }
  .cx-savedlist { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .cx-saveditem { display: flex; align-items: center; gap: 12px; border: 1px solid #e3edee; background: #fff; padding: 9px 12px; }
  .cx-saveditem:hover { border-color: var(--accent); background: #f6fbfb; }
  .cx-saveditem .name { font-size: 14px; font-weight: 700; flex: 1; min-width: 0; }
  .cx-saveditem .meta { font-size: 11.5px; color: var(--text-note); white-space: nowrap; }
  .cx-saveditem .acts { display: flex; gap: 6px; }
  .cx-saveditem button { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 12px; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--text-sub); }
  .cx-saveditem .load-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cx-saveditem .del-btn:hover { border-color: var(--price-color); color: var(--price-color); }
  .cx-saveempty { font-size: 13px; color: var(--text-note); padding: 12px 2px; }

  .cx-preview-label { max-width: 1180px; margin: 22px auto 10px; padding: 0 24px; font-size: 13.5px; font-weight: 700; color: var(--text-sub); letter-spacing: .08em; }
  .cx-stage { display: flex; justify-content: center; padding: 0 12px; }
  .cx-placeholder { width: 794px; max-width: 100%; border: 2px dashed var(--border); background: #fff; padding: 70px 24px; text-align: center; color: var(--text-sub); font-size: 15.5px; line-height: 1.9; }
  #cx-print:disabled { cursor: not-allowed; opacity: .55; background: #64748b; }

  @media print {
    .tss-toolbar, .cx-panel, .cx-preview-label, .cx-pagenum { display: none !important; }
    .cx-wrap { padding: 0; }
    .cx-stage { padding: 0; display: block; }
    body { background: #fff; }
    /* 編集中の目印は紙に出さない。1ページずつ改ページする */
    .cx-pagewrap {
      width: 210mm;
      height: 297mm;
      gap: 0;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
      break-after: page;
      page-break-after: always;
    }
    .cx-pagewrap.is-current .page { outline: none; }
    .cx-pagewrap .page { page-break-after: auto; break-after: auto; box-shadow: none; }
    .cx-pagewrap:last-child { page-break-after: auto; break-after: auto; }
    .page, .page * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* design.css と同じ理由（794×1123px は A4 より 0.48px 高い）で実寸を指定する */
    .page { width: 210mm; height: 297mm; max-width: 210mm; max-height: 297mm; overflow: hidden; }
    /* 印刷ボタン以外（Ctrl+P・共有メニュー）からでも、4商品未満の帳票は絶対に出さない。 */
    body.cx-print-blocked .cx-stage { display: none !important; }
    body.cx-print-blocked::after {
      content: '印刷できません。各ページの商品を必ず4点そろえてください。';
      display: block;
      padding: 20mm;
      color: #991b1b;
      font-size: 16pt;
      font-weight: 700;
    }
  }
  @media (max-width: 860px) {
    .cx-fields { grid-template-columns: 1fr; }
    .cx-stage { justify-content: flex-start; overflow-x: auto; }
    .cx-pagewrap { align-items: flex-start; flex: none; }
    .cx-pagenum { position: sticky; left: 0; }
  }
</style>

      pages:[['おしりふき・とろみ剤','CR02 とろみ剤'],['おしりふき・とろみ剤','CR03 とろみ剤（予備）']] },
    { name:'ボディケア・口腔ケア', label:'施設向け ボディケア・口腔ケア', lead:'清拭・足浴と、毎日の口腔ケアに。',
      pages:[['サラヤ','SR03 ボディケア・口腔ケア'],['花王・ロケット石鹸','12 ボディソープ'],['花王・ロケット石鹸','13 ビューティ/オーラルケア']] },
  ];

  // メーカーをまたいで長い商品名を選んでも本文が切れないよう、写真枠は統一したまま余白を確保する。
  const TOKENS = { photoHeight:170, cardTitleMinHeight:42, cardTitleFontSize:'16', descMinHeight:34, descFontSize:'11.5' };
  const MAX = 4;

  // メーカー一覧。大王製紙はブランドで2つに分かれているのでまとめて扱う。
  const MAKER_GROUPS = [
    { name: '花王プロフェッショナル', match: m => m === '花王プロフェッショナル' },
    { name: 'ロケット石鹸',           match: m => m === 'ロケット石鹸' },
    { name: 'ライオンハイジーン',     match: m => m === 'ライオンハイジーン' },
    { name: 'ジャパックス',           match: m => m === 'ジャパックス' },
    { name: '大王製紙',               match: m => m.indexOf('大王製紙') === 0 },
    { name: '新橋製紙',               match: m => m === '新橋製紙' },
    { name: '昭和紙工',               match: m => m === '昭和紙工' },
    { name: '竹虎',                   match: m => m === '竹虎' },
    { name: 'サラヤ',                 match: m => m === 'サラヤ' },
    { name: 'ユニ・チャーム',         match: m => m === 'ユニ・チャーム' },
    { name: '第一衛材',               match: m => m === '第一衛材' },
    { name: 'カミ商事',               match: m => m === 'カミ商事' },
    { name: 'アサヒグループ食品',     match: m => m === 'アサヒグループ食品' },
  ];
  const MAKERS = MAKER_GROUPS.map(g => ({
    name: g.name,
    items: products.items.filter(it => g.match(it.maker)),
  })).filter(g => g.items.length);

  let activeSrc = null;       // { kind:'cat'|'maker', cat?, maker? }
  let activeGenre = '';
  // ページごとに4商品。見出しもページ単位で持つ。
  const newPage = () => ({ ids: [], title: '消耗品一覧', subtitle: '', lead: '', label: '業務用 消耗品' });
  let pages = [newPage()];
  let current = 0;            // いま編集しているページの番号（0始まり）
  let showCodes = true;
  let askMode = false;

  /* ---------- チラシの共有用エンコード（メールでリンクとして送る） ----------
     商品ID・見出しだけの軽いJSONをBase64url化してURLの?f=へ入れる。
     日本語の見出しは%エンコードよりBase64のほうが短くなるため、UTF-8バイト列をBase64にする。 */
  function encodeFlyerShare(name, pagesToShare) {
    const payload = {
      n: name || '',
      p: pagesToShare.map(p => ({ i: p.ids, t: p.title, s: p.subtitle, l: p.lead, b: p.label })),
    };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeFlyerShare(encoded) {
    try {
      const b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
      const payload = JSON.parse(decodeURIComponent(escape(atob(padded))));
      const arr = payload && Array.isArray(payload.p) ? payload.p : null;
      if (!arr) return null;
      const decodedPages = arr.map(p => ({
        ids: Array.isArray(p.i) ? p.i.filter(x => Number.isFinite(x) && byId.has(x)) : [],
        title: String(p.t || '消耗品一覧'),
        subtitle: String(p.s || ''),
        lead: String(p.l || ''),
        label: String(p.b || '業務用 消耗品'),
      })).filter(p => p.ids.length);
      if (!decodedPages.length) return null;
      return { name: String((payload && payload.n) || ''), pages: decodedPages };
    } catch (e) {
      return null;
    }
  }

  const cur = () => pages[current];

  const byId = new Map(products.items.map(it => [it.id, it]));

  // URLに共有用のチラシデータ（?f=...）が付いていれば、それを最初の状態として読み込む。
  // メールで送られたリンクを開いたときに、送信者が作ったチラシがそのまま表示される。
  (function loadSharedFlyer() {
    const encoded = new URLSearchParams(location.search).get('f');
    if (!encoded) return;
    const decoded = decodeFlyerShare(encoded);
    if (!decoded) {
      alert('共有されたチラシの読み込みに失敗しました。リンクが正しいかご確認ください。');
      return;
    }
    pages = decoded.pages;
    current = 0;
    document.getElementById('cx-save-name').value = decoded.name || '';
  })();

  function catItems(cat) {
    if (typeof cat.match === 'function') return products.items.filter(cat.match);
    const out = [];
    for (const [flier, page] of cat.pages) {
      for (const it of products.items) {
        if (it.flier === flier && it.page === page) out.push(it);
      }
    }
    return out;
  }
  function genreLabel(item) {
    const page = String(item.page || '');
    if (/テープ止めタイプ/.test(page)) return '紙おむつ（テープ止め）';
    if (/パンツタイプ|リハビリパンツ/.test(page)) return '紙おむつ（パンツタイプ）';
    if (/尿とりパッド（日中用）/.test(page)) return '尿とりパッド（日中用）';
    if (/夜用パッド/.test(page)) return '尿とりパッド（夜用）';
    if (/カバータイプ・装着パッド/.test(page)) return 'カバータイプ・装着パッド';
    if (/特殊形状パッド/.test(page)) return '特殊形状パッド';
    let label = page
      .replace(/^(?:OM|SR|CR)\d+\s+/, '')
      .replace(/^\d+\s+/, '')
      .replace(/\s+\d+$/, '')
      .replace(/（予備）/g, '')
      .trim();
    if (/^トイレット(?:\s+エルヴェール)?$/.test(label)) return 'トイレットペーパー';
    if (/^フェルラック/.test(label)) return 'エプロン・ガウン';
    return label || item.tag || 'その他';
  }
  function makerGenres() {
    if (!activeSrc || activeSrc.kind !== 'maker') return [];
    const groups = new Map();
    activeSrc.maker.items.forEach(item => {
      const genre = genreLabel(item);
      const group = groups.get(genre) || [];
      group.push(item);
      groups.set(genre, group);
    });
    return [...groups].map(([name, items]) => ({ name, items }));
  }
  function srcItems() {
    if (!activeSrc) return [];
    if (activeSrc.kind === 'cat') return catItems(activeSrc.cat);
    const groups = makerGenres();
    if (activeGenre) return (groups.find(group => group.name === activeGenre) || { items: [] }).items;
    return groups.flatMap(group => group.items);
  }
  // 帯とタイトルにはメーカー名を出さない（お客様にお渡しする紙面のため）
  function srcLabel() {
    if (!activeSrc) return '業務用 消耗品';
    return activeSrc.kind === 'cat' ? activeSrc.cat.label : '業務用 消耗品';
  }

  /* ---------- ① 用途 / メーカー ---------- */
  document.getElementById('cx-cats').innerHTML = CATS.map((c, i) =>
    `<button type="button" class="cx-cat" data-kind="cat" data-i="${i}">${esc(c.name)}</button>`).join('');
  document.getElementById('cx-makers').innerHTML = MAKERS.map((m, i) =>
    `<button type="button" class="cx-cat" data-kind="maker" data-i="${i}">${esc(m.name)}<span class="cx-n">${m.items.length}</span></button>`).join('');

  function chooseSource(b) {
    const p = cur();
    if (b.dataset.kind === 'cat') {
      const c = CATS[Number(b.dataset.i)];
      activeSrc = { kind: 'cat', cat: c };
      p.title = c.name;
      p.lead = c.lead;
    } else {
      // メーカーを選んでも、紙面には「消耗品一覧」と当たり障りのない見出しを入れる
      activeSrc = { kind: 'maker', maker: MAKERS[Number(b.dataset.i)] };
      p.title = '消耗品一覧';
      p.lead = '業務用消耗品のご案内です。';
    }
    activeGenre = '';
    p.subtitle = '';
    p.label = srcLabel();
    syncFields();
    document.querySelectorAll('.cx-cat').forEach(x => x.classList.toggle('active', x === b));
    renderList();
    renderFlyer();
  }
  ['cx-cats', 'cx-makers'].forEach(id =>
    document.getElementById(id).addEventListener('click', (e) => {
      const b = e.target.closest('.cx-cat');
      if (b) chooseSource(b);
    }));

  /* ---------- ② 商品を4点（ページごと） ---------- */
  function syncFields() {
    const p = cur();
    document.getElementById('cx-title').value = p.title;
    document.getElementById('cx-subtitle').value = p.subtitle;
    document.getElementById('cx-lead').value = p.lead;
  }

  function renderPagebar() {
    const bar = document.getElementById('cx-pagebar');
    const tabs = pages.map((p, i) =>
      `<button type="button" class="cx-pagetab${i === current ? ' active' : ''}" data-page="${i}">${i + 1}ページ目<span class="cnt">${p.ids.length}/${MAX}</span></button>`).join('');
    // 4点そろったページだけ、次のページを足せる
    const canAdd = cur().ids.length >= MAX;
    const add = canAdd
      ? '<button type="button" class="cx-pagetab cx-pageadd" id="cx-addpage">＋ 次のページへ</button>'
      : '';
    const del = pages.length > 1
      ? '<button type="button" class="cx-pagedel" id="cx-delpage">このページを削除</button>'
      : '';
    bar.innerHTML = tabs + add + del;
  }

  function renderGenreFilters() {
    const bar = document.getElementById('cx-genres');
    const groups = makerGenres();
    if (!groups.length) {
      bar.innerHTML = '';
      return;
    }
    const allCount = groups.reduce((sum, group) => sum + group.items.length, 0);
    bar.innerHTML = `<span class="cx-genres-label">ジャンルで絞る</span>
      <button type="button" class="cx-genre-btn${activeGenre ? '' : ' active'}" data-genre-index="-1">すべて<span class="cnt">${allCount}</span></button>`
      + groups.map((group, index) => `<button type="button" class="cx-genre-btn${activeGenre === group.name ? ' active' : ''}" data-genre-index="${index}">${esc(group.name)}<span class="cnt">${group.items.length}</span></button>`).join('');
  }

  function renderList() {
    renderPagebar();
    renderGenreFilters();
    const el = document.getElementById('cx-list');
    const picked = cur().ids;
    if (!activeSrc) {
      el.innerHTML = '<div class="cx-empty">上のボタン（用途またはメーカー）を押すと、商品が表示されます。</div>';
    } else {
      const items = srcItems();
      const full = picked.length >= MAX;
      const genreCounts = new Map();
      items.forEach(item => {
        const genre = genreLabel(item);
        genreCounts.set(genre, (genreCounts.get(genre) || 0) + 1);
      });
      let previousGenre = '';
      el.innerHTML = items.map(it => {
        const on = picked.includes(it.id);
        const dis = !on && full;
        const genre = genreLabel(it);
        const groupCount = genreCounts.get(genre);
        const heading = activeSrc.kind === 'maker' && genre !== previousGenre
          ? `<div class="cx-genre-heading">${esc(genre)}<span class="cnt">${groupCount}商品</span></div>`
          : '';
        previousGenre = genre;
        return `
          ${heading}
          <label class="cx-item${on ? ' is-checked' : ''}${dis ? ' is-disabled' : ''}">
            <input type="checkbox" data-id="${it.id}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''} />
            <span class="th"><img src="${esc(it.image)}?v=20260908-1" alt="" loading="lazy" /></span>
            <span class="tx">
              <span class="gr">${esc(genre)}</span>
              <span class="nm">${esc(it.name)}</span>
              <span class="mk">${esc(it.maker)}　${esc(it.spec)}</span>
            </span>
          </label>`;
      }).join('');
    }
    const c = document.getElementById('cx-count');
    const full = picked.length >= MAX;
    c.innerHTML = (current + 1) + 'ページ目：選択中<strong>' + picked.length + '</strong>／' + MAX + '点'
      + (full ? '　（4点そろいました。「＋ 次のページへ」で続きを作れます）' : '');
    c.classList.toggle('is-full', full);
    const filled = pages.filter(p => p.ids.length > 0);
    const printReady = filled.length > 0 && filled.every(p => p.ids.length === MAX);
    document.body.classList.toggle('cx-print-blocked', !printReady);
    const printBtn = document.getElementById('cx-print');
    printBtn.disabled = !printReady;
    printBtn.setAttribute('aria-disabled', String(!printReady));
    printBtn.title = printReady
      ? '4商品・社名・営業所情報を1ページに収めて印刷します'
      : '各ページの商品を4点そろえると印刷できます';
    printBtn.textContent = printReady ? '🖨 印刷 / PDF保存' : '4商品そろえると印刷可能';
  }

  document.getElementById('cx-genres').addEventListener('click', (e) => {
    const button = e.target.closest('.cx-genre-btn');
    if (!button) return;
    const index = Number(button.dataset.genreIndex);
    const groups = makerGenres();
    activeGenre = index < 0 ? '' : (groups[index] ? groups[index].name : '');
    renderList();
  });

  document.getElementById('cx-list').addEventListener('change', (e) => {
    const cb = e.target.closest('input[type="checkbox"]');
    if (!cb) return;
    const id = Number(cb.dataset.id);
    const p = cur();
    if (cb.checked) {
      if (p.ids.length >= MAX) { cb.checked = false; return; }   // 4点で打ち止め
      if (!p.ids.includes(id)) p.ids.push(id);
    } else {
      p.ids = p.ids.filter(x => x !== id);
    }
    renderList();
    renderFlyer();
  });

  document.getElementById('cx-pagebar').addEventListener('click', (e) => {
    if (e.target.closest('#cx-addpage')) {
      pages.push(newPage());
      current = pages.length - 1;
      syncFields();
      renderList();
      renderFlyer();
      // 追加直後の空ページは、商品を1点選ぶまでプレビューDOMを作らない。
      // その状態で scrollIntoView を呼ぶと例外になるため、要素があるときだけ移動する。
      const currentPreview = document.querySelector('.cx-pagewrap.is-current');
      if (currentPreview) currentPreview.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (e.target.closest('#cx-delpage')) {
      if (!confirm((current + 1) + 'ページ目を削除します。よろしいですか？')) return;
      pages.splice(current, 1);
      if (current >= pages.length) current = pages.length - 1;
      syncFields(); renderList(); renderFlyer();
      return;
    }
    const tab = e.target.closest('.cx-pagetab[data-page]');
    if (tab) {
      current = Number(tab.dataset.page);
      syncFields(); renderList(); renderFlyer();
    }
  });

  /* ---------- ③ チラシを組み立てる ---------- */
  function cardHTML(item) {
    const ask = askMode ? '<span class="tss-card-askchk" aria-hidden="true"></span>' : '';
    return `
      <article class="tss-card">
        ${ask}
        <div class="tss-card-photo" style="height:${TOKENS.photoHeight}px">
          <img src="${esc(item.image)}?v=20260908-1" alt="${esc(item.name)}" />
        </div>
        <div class="tss-card-body">
          <div class="tss-card-maker">${esc(item.maker)}</div>
          <h2 class="tss-card-name" style="min-height:${TOKENS.cardTitleMinHeight}px;font-size:${TOKENS.cardTitleFontSize}px">${esc(item.name)}</h2>
          <div class="tss-card-tags">
            <span class="tss-tag-spec">${esc(item.spec)}</span>
            <span class="tss-tag-cat">${esc(item.tag)}</span>
          </div>
          <p class="tss-card-desc" style="min-height:${TOKENS.descMinHeight}px;font-size:${TOKENS.descFontSize}px">${esc(item.desc)}</p>
          ${showCodes ? `<div class="tss-card-code">${esc(item.code)}</div>` : ''}
        </div>
      </article>`;
  }

  function pageHTML(p, office) {
    const titleHTML = p.subtitle
      ? `${esc(p.title)}<br /><span class="tss-subtitle">${esc(p.subtitle)}</span>`
      : esc(p.title);
    return `
      <section class="page">
        <header class="tss-page-header">
          <div class="tss-band">
            <div class="tss-band-label">${esc(p.label || '業務用 消耗品')}</div>
            <div class="tss-band-rule"></div>
            <div class="tss-band-aud">病院・施設向け</div>
          </div>
          <div class="tss-title-row">
            <h1>${titleHTML}</h1>
            <p class="tss-lead">${esc(p.lead)}</p>
          </div>
        </header>
        <div class="tss-grid">
          ${p.ids.map(id => cardHTML(byId.get(id))).join('')}
        </div>
        <footer class="tss-footer">
          <div class="tss-footer-left">
            <div class="tss-footer-office">太陽シルバーサービス㈱　${esc(office.name)}</div>
            <div class="tss-footer-addr">${esc(office.address)}</div>
            <div class="tss-footer-tel"><span>TEL ${esc(office.tel)}</span><span>FAX ${esc(office.fax)}</span></div>
            <div class="tss-footer-contact">
              <div class="tss-footer-contact-item"><span class="tss-footer-contact-label">${office.contactName ? '担当' : '所長'}</span><span class="tss-footer-contact-name">${esc(office.contactName || office.manager)}</span></div>
              ${office.mobile ? `<div class="tss-footer-contact-item"><span class="tss-footer-contact-label">携帯</span><span class="tss-footer-contact-mobile">${esc(office.mobile)}</span></div>` : ''}
            </div>
          </div>
        </footer>
      </section>`;
  }

  function renderFlyer() {
    const stage = document.getElementById('cx-stage');
    const filled = pages.filter(p => p.ids.length > 0);
    if (!filled.length) {
      stage.innerHTML = '<div class="cx-placeholder">用途またはメーカーをえらび、商品を4点チェックすると<br>ここにチラシができあがります。</div>';
      return;
    }
    // 担当者はこの端末の設定を優先する（ツールバーで変更でき、次回も同じ内容を使う）
    const office = tssOfficeWithStaff(tssLoadOffice());
    // 空のページは印刷にもプレビューにも出さない
    stage.innerHTML = pages.map((p, i) => p.ids.length === 0 ? '' : `
      <div class="cx-pagewrap${i === current ? ' is-current' : ''}${p.ids.length === MAX ? '' : ' is-incomplete'}" data-product-count="${p.ids.length}">
        <div class="cx-pagenum">${i + 1}ページ目${i === current ? '（編集中）' : ''}</div>
        ${pageHTML(p, office)}
      </div>`).join('');
  }

  ['cx-title', 'cx-subtitle', 'cx-lead'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => {
      const p = cur();
      p.title = document.getElementById('cx-title').value;
      p.subtitle = document.getElementById('cx-subtitle').value;
      p.lead = document.getElementById('cx-lead').value;
      renderFlyer();
    }));

  // 担当者の入力。変更するとこの端末に保存し、チラシの下部へすぐ反映する。
  // 複数人ぶん保存され、次回以降は「保存済みの担当者」セレクトから選べる。
  (function initStaff() {
    const nameEl = document.getElementById('tss-staff-name');
    const mobEl = document.getElementById('tss-staff-mobile');
    const selectEl = document.getElementById('tss-staff-select');
    const saved = tssLoadStaff();
    const base = saved || tssLoadOffice();
    nameEl.value = saved ? saved.name : (base.contactName || '');
    mobEl.value = saved ? saved.mobile : (base.mobile || '');
    tssWireStaffPicker({ selectEl, nameEl, mobileEl: mobEl, onChange: renderFlyer });
  })();

  document.getElementById('cx-toggle-codes').addEventListener('change', (e) => {
    showCodes = e.target.checked; renderFlyer();
  });
  document.getElementById('cx-toggle-ask').addEventListener('change', (e) => {
    askMode = e.target.checked; renderFlyer();
  });
  document.getElementById('cx-clear').addEventListener('click', () => {
    if (!confirm('えらんだ商品とページをすべて消して、最初からやり直します。よろしいですか？')) return;
    pages = [newPage()];
    current = 0;
    activeSrc = null;
    document.getElementById('cx-save-name').value = '';
    document.querySelectorAll('.cx-cat').forEach(x => x.classList.remove('active'));
    syncFields(); renderList(); renderFlyer();
  });
  async function printImagesReady(root, timeoutMs = 12000) {
    const images = Array.from(root.querySelectorAll('img'));
    const allSettled = Promise.all(images.map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    })).then(() => true);
    const beforeTimeout = await Promise.race([
      allSettled,
      new Promise(resolve => setTimeout(() => resolve(false), timeoutMs)),
    ]);
    return beforeTimeout && images.every(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
  }

  document.getElementById('cx-print').addEventListener('click', async () => {
    const filled = pages.filter(p => p.ids.length > 0);
    if (!filled.length) { alert('商品をえらんでください。'); return; }
    const half = filled.filter(p => p.ids.length < MAX);
    if (half.length) {
      alert('印刷できません。' + half.map(p => pages.indexOf(p) + 1).join('・')
        + 'ページ目の商品を必ず4点そろえてください。\n1ページには、4商品と社名・営業所情報をまとめて印刷します。');
      return;
    }
    const stage = document.getElementById('cx-stage');
    const printButton = document.getElementById('cx-print');
    printButton.disabled = true;
    printButton.textContent = '画像とレイアウトを確認中…';
    const imagesReady = await printImagesReady(stage);
    if (!imagesReady) {
      alert('商品画像を読み込めなかったため、安全のため印刷を中止しました。通信状態を確認して、もう一度お試しください。');
      renderList();
      return;
    }
    const renderedPages = Array.from(document.querySelectorAll('.cx-pagewrap .page'));
    const invalidLayout = renderedPages.some(page => {
      const pageRect = page.getBoundingClientRect();
      const cards = Array.from(page.querySelectorAll('.tss-card'));
      const footer = page.querySelector('.tss-footer');
      const clippedCard = cards.some(card => {
        const cardRect = card.getBoundingClientRect();
        const body = card.querySelector('.tss-card-body');
        const bodyRect = body && body.getBoundingClientRect();
        return !body || body.scrollHeight > body.clientHeight + 1 || bodyRect.bottom > cardRect.bottom + 1;
      });
      return cards.length !== MAX ||
        !footer || !page.querySelector('.tss-footer-office') ||
        footer.getBoundingClientRect().bottom > pageRect.bottom + 1 ||
        page.scrollHeight > page.clientHeight + 1 ||
        page.scrollWidth > page.clientWidth + 1 ||
        clippedCard;
    });
    if (invalidLayout) {
      alert('1ページに4商品と社名を安全に収められないため、印刷を中止しました。商品名や説明を短くして、もう一度お試しください。');
      renderList();
      return;
    }
    window.print();
    renderList();
  });

  /* ================= 保存したチラシ（名前を付けて何度でも呼び出せる） =================
     1件 = { id, name, savedAt, pages }。名前をキーに上書き保存する。 */
  const CUSTOM_SAVED_KEY = 'tss_custom_saved_v1';
  function loadSavedFlyers() {
    try { return JSON.parse(localStorage.getItem(CUSTOM_SAVED_KEY)) || []; } catch (e) { return []; }
  }
  function writeSavedFlyers(list) {
    try { localStorage.setItem(CUSTOM_SAVED_KEY, JSON.stringify(list)); return true; }
    catch (e) { alert('保存できませんでした。ブラウザの保存容量が上限に達している可能性があります。'); return false; }
  }
  function fmtSavedDate(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function renderSavedFlyers() {
    const list = loadSavedFlyers().sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1));
    document.getElementById('cx-saved-count').textContent = list.length;
    const el = document.getElementById('cx-saved-list');
    if (!list.length) {
      el.innerHTML = '<div class="cx-saveempty">まだ保存されたチラシはありません。名前を入れて「このチラシを保存」を押すと、ここに残ります。</div>';
      return;
    }
    el.innerHTML = list.map(s => `
      <div class="cx-saveditem" data-id="${esc(s.id)}">
        <span class="name">${esc(s.name)}</span>
        <span class="meta">${(s.pages || []).length}ページ ／ ${esc(fmtSavedDate(s.savedAt))}</span>
        <span class="acts">
          <button type="button" class="load-btn">呼び出す</button>
          <button type="button" class="del-btn">削除</button>
        </span>
      </div>`).join('');
  }

  document.getElementById('cx-save-btn').addEventListener('click', () => {
    const input = document.getElementById('cx-save-name');
    const name = input.value.trim();
    if (!name) { alert('チラシの名前を入力してください。'); input.focus(); return; }
    const filled = pages.filter(p => p.ids.length > 0);
    if (!filled.length) { alert('商品が選ばれていません。'); return; }

    const list = loadSavedFlyers();
    const existing = list.find(s => s.name === name);
    if (existing && !confirm('「' + name + '」はすでに保存されています。上書きしますか？')) return;

    const entry = {
      id: existing ? existing.id : 'cf' + Date.now(),
      name,
      savedAt: new Date().toISOString(),
      pages: JSON.parse(JSON.stringify(pages)),
    };
    const next = existing ? list.map(s => (s.id === existing.id ? entry : s)) : list.concat([entry]);
    if (!writeSavedFlyers(next)) return;
    renderSavedFlyers();
  });

  document.getElementById('cx-saved-list').addEventListener('click', (e) => {
    const row = e.target.closest('.cx-saveditem');
    if (!row) return;
    const id = row.dataset.id;
    const list = loadSavedFlyers();
    const entry = list.find(s => s.id === id);
    if (!entry) return;

    if (e.target.closest('.del-btn')) {
      if (!confirm('「' + entry.name + '」の保存を削除します。よろしいですか？')) return;
      writeSavedFlyers(list.filter(s => s.id !== id));
      renderSavedFlyers();
      return;
    }
    if (e.target.closest('.load-btn')) {
      const hasContent = pages.some(p => p.ids.length > 0);
      if (hasContent && !confirm('いま作成中のチラシを破棄して「' + entry.name + '」を呼び出します。よろしいですか？')) return;
      pages = JSON.parse(JSON.stringify(entry.pages));
      current = 0;
      activeSrc = null;
      document.getElementById('cx-save-name').value = entry.name;
      document.querySelectorAll('.cx-cat').forEach(x => x.classList.remove('active'));
      syncFields(); renderList(); renderFlyer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // メールで共有：いま作っているチラシを開けるリンクを、メールの下書きに入れる。
  document.getElementById('cx-share-btn').addEventListener('click', () => {
    const filled = pages.filter(p => p.ids.length > 0);
    if (!filled.length) { alert('商品が選ばれていません。商品を選んでから共有してください。'); return; }
    if (filled.some(p => p.ids.length !== MAX) &&
        !confirm('4点そろっていないページがあります。そのまま共有しますか？')) return;

    const name = document.getElementById('cx-save-name').value.trim();
    const encoded = encodeFlyerShare(name, filled);
    const url = new URL(location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('f', encoded);
    const link = url.toString();
    if (link.length > 6000) {
      alert('チラシの内容が多いため、共有リンクが長くなりすぎます。ページ数や文章を減らすか、先に保存してから一部だけ共有してください。');
      return;
    }
    const subject = '【消耗品チラシ】' + (name || 'ご案内');
    const body = '消耗品チラシを作成しました。下記のリンクを開くとご覧いただけます。\n\n' + link +
      '\n\n※リンクを開くと、ブラウザ上でチラシの確認・印刷ができます。';
    location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  });

  syncFields();
  renderList();
  renderFlyer();
  renderSavedFlyers();
})();
</script>
</body>
</html>
